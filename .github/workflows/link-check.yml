name: Weekly Link Check

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Check links
        id: link-check
        run: |
          set +e
          npx markdown-link-check README.md --config .markdown-link-check.json --verbose > link-check-output.txt 2>&1
          status=$?
          set -e
          broken=$(grep -cE '^[[:space:]]*\[✖\]' link-check-output.txt || true)
          echo "broken=${broken:-0}" >> "$GITHUB_OUTPUT"
          # A non-zero exit with no broken links means the tool itself errored
          # (bad config, network problem) rather than finding dead links -
          # that's a real CI failure, not routine link rot.
          if [ "$status" -ne 0 ] && [ "${broken:-0}" -eq 0 ]; then
            exit "$status"
          fi
          exit 0

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🔗 Weekly Link Check — README.md"
            echo ""
            if [ -f link-check-output.txt ]; then
              total=$(grep -cE '^[[:space:]]*\[[✓✖]\]' link-check-output.txt || true)
              broken=$(grep -cE '^[[:space:]]*\[✖\]' link-check-output.txt || true)
              total=${total:-0}
              broken=${broken:-0}
              ok=$((total - broken))
              echo "**${ok}/${total} links OK**, **${broken} broken**."
              echo ""
              if [ "$broken" -gt 0 ]; then
                echo "### Broken links"
                echo ""
                echo "| URL | Status |"
                echo "| --- | --- |"
                grep -E '^[[:space:]]*\[✖\]' link-check-output.txt \
                  | sed -E 's/^[[:space:]]*\[✖\][[:space:]]*(.*)[[:space:]]→[[:space:]]Status:[[:space:]]*(.*)$/| \1 | \2 |/'
                echo ""
                echo "Fix or replace these in \`README.md\` (via \`data/modules.yaml\`), or, if a link is a known false positive, add it to \`.markdown-link-check.json\`'s \`ignorePatterns\`."
              else
                echo "All links resolved successfully. ✅"
              fi
            else
              echo "⚠️ The link-check step did not produce output — see the job log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate broken-links badge
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          broken="${{ steps.link-check.outputs.broken }}"
          broken="${broken:-0}"
          color="brightgreen"
          if [ "$broken" -gt 0 ]; then color="red"; fi
          cat > .github/badges/broken-links.json <<EOF
          {"schemaVersion":1,"label":"broken links","message":"${broken}","color":"${color}"}
          EOF

      - name: Commit broken-links badge
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update broken-links badge"
          file_pattern: .github/badges/broken-links.json

      - name: Open issue on failure
        if: steps.link-check.outputs.broken != '0'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/broken-link.md
          update_existing: true
          search_existing: open
